# NOVA AI Cloud — 100% Free Cloud Deploy to Cloudflare Workers ($0, Zero Laptop Load)
# ===================================================================================
# Deploys the entire web platform + API + Workers AI (Flux image generation + LLMs) +
# D1 SQLite database + isolated Sandbox directly from GitHub's cloud servers!
#
# One-time setup in GitHub Repo -> Settings -> Secrets and variables -> Actions:
#   - CLOUDFLARE_API_TOKEN : Cloudflare API Token ("Edit Cloudflare Workers" template + D1 Edit)
#   - OPENROUTER_API_KEY   : (Optional) Your free OpenRouter key
#   - NOVA_ACCESS_TOKEN    : (Optional) Secret password so only you can use your cloud link

name: deploy-cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy to Cloudflare Workers (free tier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: check CLOUDFLARE_API_TOKEN secret
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ☁️ النشر التلقائي على Cloudflare Workers جاهز (بانتظار مفتاح الربط لمرة واحدة)"
              echo ""
              echo "لربط حسابك المجاني في Cloudflare بدون بطاقة بنكية وبدون أي حمل على لابتوبك:"
              echo "1. افتح https://dash.cloudflare.com/profile/api-tokens واضغط **Create Token**."
              echo "2. اختر قالب **Edit Cloudflare Workers** وأضف صلاحية **Account → D1 → Edit** ثم انسخ الرمز."
              echo "3. في مستودع GitHub افتح **Settings → Secrets and variables → Actions → New repository secret**:"
              echo "   - الاسم: \`CLOUDFLARE_API_TOKEN\` والرمز الذي نسخته."
              echo "   - (اختياري) أضف \`NOVA_ACCESS_TOKEN\` لوضع كلمة سر خاصة لموقعك، و\`OPENROUTER_API_KEY\` لمفتاحك المجاني."
              echo "4. اضغط **Re-run jobs** أو **Run workflow** وسيظهر لك رابط موقعك السحابي الجاهز هنا فوراً!"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: install workspace
        if: steps.check.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: provision D1 + build UI + deploy Worker & Sandbox
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NOVA_ACCESS_TOKEN: ${{ secrets.NOVA_ACCESS_TOKEN }}
        run: node scripts/deploy-cloudflare.mjs
