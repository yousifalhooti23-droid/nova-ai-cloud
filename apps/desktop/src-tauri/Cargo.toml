[package]
name = "nova-ai-cloud"
version = "0.1.0"
description = "NOVA AI Cloud desktop shell — a native window around the Nova sidecar server."
authors = ["NOVA"]
edition = "2021"
rust-version = "1.77.2"

# The desktop shell is intentionally tiny: it owns the window, the installer
# and the updater. ALL product logic lives in the Nova sidecar (Node) and the
# web UI it serves. AI models are reached over the network, never embedded.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"

# Keep the release binary small and the CI build memory-friendly.
[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
panic = "abort"
strip = true
